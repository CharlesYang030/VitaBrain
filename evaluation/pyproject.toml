[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-long-horizon-agent-lab"
version = "0.1.0"
description = "Auditable evaluation workspace for embodied long-horizon spatial agents"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "Flask>=3.0,<4",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "Pillow>=10.1,<13",
  "tiktoken>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
gt-navigation = ["numpy>=1.26,<3", "opencv-python-headless>=4.8,<5"]
spatial = ["numpy>=1.26,<3", "opencv-python-headless>=4.8,<5", "onnxruntime>=1.18,<2", "scikit-image>=0.22,<1"]

[project.scripts]
agentlab-web = "agentlab.web.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agentlab*"]

[tool.setuptools.package-data]
"agentlab" = ["task_catalog.json", "task_progress_coverage.json"]
"agentlab.web" = ["templates/*.html", "static/*.css", "static/*.js"]
